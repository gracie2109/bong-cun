name: Mobile Android

# Builds the customer app (apps/web mobile target wrapped by apps/mobile) into a debug APK.
# Download it from the run's Artifacts and install it on an Android phone.
# Needs two repository VARIABLES (not secrets; both values are public anon values, same as on Vercel):
#   Settings > Secrets and variables > Actions > Variables: SUPABASE_URL and SUPABASE_KEY.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-android.yml"

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
    steps:
      - name: Check the repository variables
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ] && missing="$missing SUPABASE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository variables::Add$missing under Settings > Secrets and variables > Actions > Variables (same values as on Vercel), then re-run this workflow. Without them the app would be built pointing at no database."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run mobile:check
      - name: Build the web bundle (mobile target)
        run: npm run generate:mobile
      - name: Copy it into the Android project
        run: npm run sync -w @bongcun/mobile
      - name: Build the debug APK
        run: npm run apk -w @bongcun/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: bongcun-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
