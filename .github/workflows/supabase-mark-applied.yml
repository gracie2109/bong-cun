name: Supabase mark migrations applied

# One-off, manual. Records migrations that were already pasted into the SQL Editor as applied,
# so that "Supabase migrate" does not run them again. Run once, before the first migrate run.
on:
  workflow_dispatch:
    inputs:
      up_to:
        description: "Last migration version already applied by hand (e.g. 20261007140000)"
        required: true
      reverted:
        description: "Versions in the database history that have no local file (space separated); removed from the history only, data is not touched"
        required: false
        default: ""

jobs:
  mark:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Mark migrations up to the given version as applied
        env:
          UP_TO: ${{ inputs.up_to }}
          REVERTED: ${{ inputs.reverted }}
        run: |
          versions=$(ls supabase/migrations | grep -o '^[0-9]\+' | awk -v max="$UP_TO" '$1 <= max')
          echo "Marking as applied: $versions"
          supabase migration repair --status applied $versions
          if [ -n "$REVERTED" ]; then
            echo "Removing from history: $REVERTED"
            supabase migration repair --status reverted $REVERTED
          fi
