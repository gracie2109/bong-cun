name: Supabase migrate

# Applies new files in supabase/migrations to the production database when it is run.
# Needs the repo secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF.
# Manual only until "Supabase mark migrations applied" has run once; then add back
#   push: { branches: [main], paths: ["supabase/migrations/**"] }
# so that every merged migration is applied automatically.
on:
  workflow_dispatch:

concurrency: supabase-migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --include-all
